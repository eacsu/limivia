[project]
name = "limivia"
version = "0.3.0"
description = "LIMIVIA：事件式协议v3 Python SDK"
authors = [{name = "migo", email = "1695587905@qq.com"}]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "bleak>=3,<4",
    "pyserial>=3.5,<4",
    "anyio>=4,<5",
    "typer>=0.15,<1",
    "websockets>=15,<16",
    "paho-mqtt>=2.1,<3",
    "typing-extensions>=4.12,<5",
    "async-timeout>=5,<6; python_version < '3.11'",
    "dbus-fast==3.1.2; sys_platform == 'linux' and python_version < '3.11'",
]

[project.scripts]
limivia = "limivia.commands.app:app"

[tool.poetry]
packages = [{include = "limivia", from = "src"}]
include = [
    {path = "tests", format = "sdist"},
    {path = "examples", format = "sdist"},
    {path = "scripts", format = "sdist"},
    {path = "docs/protocol-v3.md", format = "sdist"},
    {path = "docs/peripheral-matrix.md", format = "sdist"},
    {path = "docs/migration-v3.md", format = "sdist"},
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ruff = ">=0.11,<1"
mypy = ">=1,<2"
# mypy 以 3.10 为目标，在 3.11/3.12 开发环境也需要回移库的类型。
async-timeout = ">=5,<6"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["SIM117"]
"examples/*/*.py" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["src/limivia", "tests/typecheck.py", "examples"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["serial", "serial.*"]
ignore_missing_imports = true

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
